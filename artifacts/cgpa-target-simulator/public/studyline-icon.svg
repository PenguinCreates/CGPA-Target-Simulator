<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Studyline</title>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3478d5"/>
      <stop offset="1" stop-color="#174d9e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#blue)"/>
  <rect width="512" height="512" fill="url(#shine)"/>
  <rect x="14" y="14" width="484" height="484" rx="106" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="4"/>
  <text x="256" y="358" text-anchor="middle" fill="#fff" font-family="Georgia, 'Times New Roman', serif" font-size="302" letter-spacing="-18">s.</text>
