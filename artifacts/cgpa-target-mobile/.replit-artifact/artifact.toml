kind = "mobile"
previewPath = "/cgpa-target-mobile/"
title = "Studyline CGPA Mobile"
description = "A native iPhone and Android companion for the Studyline CGPA Target Simulator. Students can edit completed semesters, model upcoming grades, track their graduation target, and keep their plans saved locally for offline use."
version = "1.0.0"
id = "artifacts/cgpa-target-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/cgpa-target-mobile/" ]
localPort = 24366

[services.development]
run = "pnpm --filter @workspace/cgpa-target-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cgpa-target-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/cgpa-target-mobile", "run", "serve" ]

[services.env]
PORT = "24366"
BASE_PATH = "/cgpa-target-mobile/"
